name: webapp
services:
  web:
    image: php:8.3-apache
    container_name: webserver
    ports:
      - "80:80"
    volumes:
      - ./source:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.4.5
    container_name: dbserver
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: db_webapp
      MYSQL_USER: webapp_user
      MYSQL_PASSWORD: webapp_user_pass
  dbmanager:
    image: phpmyadmin:5.2.2-apache
    container_name: dbmanager
    ports:
      - "88:80"
    environment:
      - PMA_HOST: db
    depends_on:
      - db
volumes:
  db_data:
