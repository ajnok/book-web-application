<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>การใช้ JavaScript แบบภายใน</title>
	<script>
		console.log("อิลิเมนต์ยังไม่ได้โหลด");
		console.log(document.getElementById("content").innerHTML);
		for (var i = 1; i <= 3; i++) {
			console.log("การทำงาน JavaScript แบบภายใน ครั้งที่ " + i);
		}
	</script>
</head>
<body>
<h1>ตัวอย่างการใช้ JavaScript แบบภายใน</h1>
<p  id="content">เนื้อหาของอิลิเมนต์ p</p>
<button onclick="greeting()" id="age">ทักทาย</button>
<script>
	console.log("อิลิเมนต์โหลดเสร็จแล้ว");
	console.log(document.getElementById("content").innerHTML);
	function greeting() {
		console.log("สวัสดี Programmer");
	}
</script>
</body>
</html>
