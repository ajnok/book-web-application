<h1>ตัวอย่างการใช้ JavaScript แบบ Inline</h1>
<button onclick="var message = 'สวัสดีครับ!'; console.log(message);">
	คลิกเพื่อแสดงข้อความในคอนโซล
</button>
<button onclick="var x = 5; var y = 3; console.log('ผลบวก: ' + (x + y));">
	คำนวณเลข
</button>
<button onclick="for(var i = 1; i <= 3; i++) { console.log('ครั้งที่ ' + i); }">
	ทำซ้ำ 3 ครั้ง
</button>
