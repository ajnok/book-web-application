<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
</head>
<body>
	<p class="highlight">ข้อความที่ 1</p>
	<p class="highlight">ข้อความที่ 2</p>
	<div class="highlight">เนื้อหาในกล่อง</div>
	<script>
		var elements = document.getElementsByClassName("highlight");
		console.log(elements.length); // แสดง: 3
		console.log(elements[0].textContent); // แสดง: ข้อความที่ 1
		console.log(elements[1].textContent); // แสดง: ข้อความที่ 2
	</script>
</body>
</html>
